name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: apps-macos-*
          path: dist
          merge-multiple: true
      - name: Verify assets and create checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          cd dist
          test -f "apps-${RELEASE_TAG}-macos-arm64.zip"
          test -f "apps-${RELEASE_TAG}-macos-x86_64.zip"
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          sha256sum apps-*.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # An existing release is never overwritten, including a partial draft.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Inspect it before retrying; no assets were overwritten." >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Native macOS CLI package manager. Requires macOS 14 or later.

          - English is the default interface language; Russian is available in Settings → Language.
          - Apple Silicon: download the arm64 ZIP.
          - Intel: download the x86_64 ZIP.
          - SHA256SUMS contains checksums for both archives.

          Extract the ZIP and move apps.app to Applications. These builds are ad hoc
          signed, not Developer ID signed or notarized. macOS Gatekeeper may require
          explicit approval in Privacy & Security after you verify the download.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" \
            --title "apps $RELEASE_TAG" --generate-notes --notes-file release-notes.md --draft
          gh release upload "$RELEASE_TAG" dist/apps-*.zip dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
